<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Only Left Sidebar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="p-0 m-0">

    <!-- Grid Container to separate Sidebar and Main Content -->
    <div class="container-fluid p-0">
        <div class="row g-0">
            
            <!-- Left Vertical Navbar -->
            <nav class="navbar navbar-expand-lg navbar-dark col-12 col-lg-3 col-xl-2  min-vh-100 align-items-start p-3"
                 style="background: linear-gradient(180deg, #0d6efd 0%, #6610f2 100%);">
                 
                <div class="container-fluid flex-lg-column align-items-lg-start p-0">
                    
                    <!-- Title wrapped onto multiple lines using text-break text-wrap -->
                    <a class="navbar-brand text-break text-wrap d-block w-100 mb-lg-4" href="#">
                        <i class="fas fa-code"></i> Bootstrap Tutorial
                    </a>
                    
                    <button class="navbar-toggler mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse w-100" id="navbarNav">
                        <ul class="navbar-nav flex-column w-100">
                            <li class="nav-item">
                                <a class="nav-link active" href="#grid">Grid System</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#flexbox">Flexbox</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#components">Components</a>
                            </li>
                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                    More
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#buttons">Buttons</a></li>
                                    <li><a class="dropdown-item" href="#cards">Cards</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" href="#media-queries">Media Queries</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>

                </div>
            </nav>

            <!-- Main Content Area (Matches col-lg-3 / col-xl-2 sidebar width) -->
            <main class="col-12 col-lg-8 col-xl-10 p-4">
                <h1>Main Content</h1>
                <p>The navbar title now cleanly wraps onto multiple lines inside the sidebar bounds.</p>
            </main>

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
